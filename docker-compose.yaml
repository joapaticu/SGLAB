services:
  webserver:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: apache_web
    ports:
      - "8080:80"
      - "444:443"
    volumes:
      - ./public-WEB:/var/www/html
      - ./docker/apache/sglab-seguridad.conf:/etc/apache2/conf-enabled/sglab-seguridad.conf:ro
      - ./docker/php/zz-sglab.ini:/usr/local/etc/php/conf.d/zz-sglab.ini:ro
     # - ../certs/etc:/etc/letsencrypt
    environment:
      - DB_HOST=database
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  database:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./public-WEB/BaseDatos.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/02-init.sh
      - mysql-data:/var/lib/mysql  # Volumen persistente para datos
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks:
      - app-network
  certbot:
    image: certbot/certbot
    container_name: certbot_renew
    volumes:
      - ./certs/etc:/etc/letsencrypt
      - ./certs/lib:/var/lib/letsencrypt
      - ./public-WEB:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/html; sleep 12h & wait $${!}; done;'"
    depends_on:
      - webserver
    restart: unless-stopped
    networks:
      - app-network

# Volúmenes nombrados para persistencia
volumes:
  mysql-data:
    driver: local

# Red personalizada para comunicación entre contenedores
networks:
  app-network:
    driver: bridge
