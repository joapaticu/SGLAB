# SGLAB: impide descargar por la web los archivos de configuración, secretos y código interno.
<FilesMatch "(^\.|\.(env|sql|sh|ya?ml|lock|json|md|txt|log|example|phar|toml|bak|zip)$)">
    Require all denied
</FilesMatch>
<Files "sglab.txt">
    Require all granted
</Files>
<DirectoryMatch "^/var/www/html/(vendor|docker|reportes_para_procesar|Models)(/|$)">
    Require all denied
</DirectoryMatch>
